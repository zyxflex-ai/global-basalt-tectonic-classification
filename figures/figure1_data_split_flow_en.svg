   <g id="text_1">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(173.647755 35.494028)">Merged dataset</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(123.894068 46.056434)">48,403 samples; 2,441 source records</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(76.829255 85.828614)">Publication-identity normalization and cross-database verification</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(55.05738 95.430801)">DOI, author–year, title and sample evidence; 18 candidate pairs adjudicated</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(125.302068 135.618668)">PAPER_ID and CV_GROUP assignment</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(135.369818 146.181074)">2,430 verified publication groups</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(128.725583 182.309307)">Fivefold stratified group split (seed 42)</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(80.646036 192.15155)">No CV_GROUP shared between development and holdout sets</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(74.115809 233.231564)">Development set</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(46.493668 243.193834)">38,094 samples; 1,946 groups</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(238.185545 233.231564)">Frozen publication-group holdout</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(247.443935 243.193834)">10,309 samples; 484 groups</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(26.512551 286.971864)">Stable-50 and ≥10/19 measured features</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(48.778801 296.574051)">35,865 samples; 1,846 groups</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(265.368459 286.971864)">Same eligibility filter</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(249.585959 296.574051)">10,086 samples; 462 groups</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(23.378208 340.67813)">Grouped fivefold CV within development set</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(28.077708 350.040263)">Feature audit, tuning and model selection</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(263.32274 340.67813)">Single final evaluation</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(218.027287 350.040263)">Publication bootstrap and frozen-model SHAP</text>
   </g>
  </g>
